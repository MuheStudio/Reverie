name: Reverie quality gate

on:
  push:
    branches: ["master", "main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reverie-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows first-party tests and package smoke
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run first-party Python tests
        run: python -m pytest

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Check and test frontend
        working-directory: frontend
        run: |
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Build unpacked Windows application
        working-directory: frontend
        env:
          REVERIE_WINDOWS_OUT: ${{ runner.temp }}\reverie-package
        run: pnpm package:win:test

      - name: Smoke-test packaged bridge
        working-directory: frontend
        run: pnpm smoke:package

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ${{ runner.temp }}/reverie-package
          format: spdx-json
          output-file: reverie-windows.spdx.json
          artifact-name: reverie-windows-sbom.spdx.json
          upload-release-assets: false
