packages:
  - '.'

virtualStoreDirMaxLength: 60

# pnpm 11 reads overrides here. Keep these equal to the frozen lockfile.
overrides:
  'brace-expansion@2.1.1': '2.1.3'
  'brace-expansion@5.0.7': '5.0.8'
  'fast-uri@3.1.2': '3.1.4'
  'tar@7.5.20': '7.5.22'

allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  core-js: true
  esbuild: true
  electron: true
  # The macOS source workflow does not build Squirrel Windows installers.
  electron-winstaller: false
